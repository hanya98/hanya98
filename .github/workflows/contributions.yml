name: generate contribution graphs

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: prepare dist directory
        run: |
          mkdir -p dist
          sudo chmod -R 777 dist

      - name: generate snake svg
        uses: Platane/snk@v3
        with:
          github_user_name: hanya98
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: fix permissions after snake step
        run: sudo chmod -R 777 dist

      - name: generate pacman svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman,minesweeper'

      - name: fix permissions after pacman step
        run: sudo chmod -R 777 dist

      - name: push dist to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
