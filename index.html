<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Byte</title>
<style>
  :root {
    --bg-deep: #0F130A;
    --bg-mid: #1B2007;
    --olive-dark: #313B08;
    --olive: #52590E;
    --olive-mid: #707610;
    --olive-light: #8C9111;
    --sage: #A4AC17;
    --cream: #EDE8C9;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg-deep);
    font-family: 'Courier New', monospace;
    color: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .stage {
    position: relative;
    width: min(420px, 92vw);
    height: min(640px, 88vh);
    background: linear-gradient(180deg, var(--bg-mid) 0%, var(--olive-dark) 100%);
    border: 3px solid var(--olive-mid);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 0 0 6px var(--bg-deep), 0 20px 60px rgba(0,0,0,0.6);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .hud {
    position: absolute;
    top: 16px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 28px;
    letter-spacing: 2px;
    color: var(--cream);
    text-shadow: 0 2px 0 var(--bg-deep);
    pointer-events: none;
    user-select: none;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(15, 19, 10, 0.82);
    text-align: center;
    padding: 24px;
  }

  .overlay.hidden { display: none; }

  .title {
    font-size: 26px;
    letter-spacing: 3px;
    color: var(--sage);
    text-transform: uppercase;
  }

  .sub {
    font-size: 13px;
    color: var(--olive-light);
    max-width: 260px;
    line-height: 1.6;
  }

  .score-line {
    font-size: 15px;
    color: var(--cream);
  }

  .score-line b {
    color: var(--sage);
  }

  .btn {
    margin-top: 6px;
    padding: 10px 26px;
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: var(--olive-mid);
    color: var(--cream);
    border: 2px solid var(--sage);
    border-radius: 4px;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease;
  }

  .btn:hover { background: var(--olive-light); }
  .btn:active { transform: scale(0.96); }

  .footer-hint {
    position: absolute;
    bottom: 10px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--olive-mid);
    user-select: none;
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <canvas id="game"></canvas>
  <div class="hud" id="hud">0</div>

  <div class="overlay" id="startOverlay">
    <div class="title">Flappy Byte</div>
    <div class="sub">Tap, click, or press Space to flap.<br/>Weave between the pillars. Don't touch olive or ground.</div>
    <button class="btn" id="startBtn">Start</button>
  </div>

  <div class="overlay hidden" id="overOverlay">
    <div class="title">Grounded</div>
    <div class="score-line">Score: <b id="finalScore">0</b> &nbsp;·&nbsp; Best: <b id="bestScore">0</b></div>
    <button class="btn" id="retryBtn">Retry</button>
  </div>

  <div class="footer-hint">FLAPPY BYTE</div>
</div>

<script>
(function () {
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const startOverlay = document.getElementById('startOverlay');
  const overOverlay = document.getElementById('overOverlay');
  const startBtn = document.getElementById('startBtn');
  const retryBtn = document.getElementById('retryBtn');
  const finalScoreEl = document.getElementById('finalScore');
  const bestScoreEl = document.getElementById('bestScore');

  const COLORS = {
    bird: '#EDE8C9',
    birdWing: '#A4AC17',
    pipe: '#52590E',
    pipeEdge: '#8C9111',
    ground: '#1B2007',
    groundTop: '#313B08'
  };

  let W, H, DPR;
  function resize() {
    DPR = window.devicePixelRatio || 1;
    W = stage.clientWidth;
    H = stage.clientHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  const GRAVITY = 1500;
  const FLAP_VELOCITY = -420;
  const PIPE_GAP = 165;
  const PIPE_WIDTH = 62;
  const PIPE_SPEED = 150;
  const PIPE_INTERVAL = 1450;
  const GROUND_HEIGHT = 56;

  let bird, pipes, score, best, lastPipeTime, running, started, lastTime;

  best = Number(localStorage.getItem('flappyByteBest') || 0);
  bestScoreEl.textContent = best;

  function reset() {
    bird = { x: W * 0.28, y: H * 0.4, vy: 0, radius: 14, rotation: 0 };
    pipes = [];
    score = 0;
    lastPipeTime = 0;
    running = false;
    started = false;
    hud.textContent = '0';
  }

  function spawnPipe() {
    const margin = 40;
    const usableHeight = H - GROUND_HEIGHT - margin * 2 - PIPE_GAP;
    const gapTop = margin + Math.random() * Math.max(usableHeight, 40);
    pipes.push({ x: W + PIPE_WIDTH, gapTop, passed: false });
  }

  function flap() {
    if (!started) {
      started = true;
      running = true;
      startOverlay.classList.add('hidden');
    }
    if (!running) return;
    bird.vy = FLAP_VELOCITY;
  }

  function endGame() {
    running = false;
    if (score > best) {
      best = score;
      localStorage.setItem('flappyByteBest', String(best));
    }
    finalScoreEl.textContent = score;
    bestScoreEl.textContent = best;
    overOverlay.classList.remove('hidden');
  }

  function update(dt, now) {
    if (!started) return;
    if (!running) return;

    bird.vy += GRAVITY * dt;
    bird.y += bird.vy * dt;
    bird.rotation = Math.max(-0.5, Math.min(1.1, bird.vy / 600));

    if (now - lastPipeTime > PIPE_INTERVAL) {
      spawnPipe();
      lastPipeTime = now;
    }

    for (const p of pipes) {
      p.x -= PIPE_SPEED * dt;
      if (!p.passed && p.x + PIPE_WIDTH < bird.x) {
        p.passed = true;
        score += 1;
        hud.textContent = score;
      }
    }
    pipes = pipes.filter(p => p.x > -PIPE_WIDTH - 10);

    const groundY = H - GROUND_HEIGHT;
    if (bird.y + bird.radius > groundY) {
      bird.y = groundY - bird.radius;
      endGame();
    }
    if (bird.y - bird.radius < 0) {
      bird.y = bird.radius;
      bird.vy = 0;
    }

    for (const p of pipes) {
      const withinX = bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + PIPE_WIDTH;
      if (withinX) {
        const hitsTop = bird.y - bird.radius < p.gapTop;
        const hitsBottom = bird.y + bird.radius > p.gapTop + PIPE_GAP;
        if (hitsTop || hitsBottom) {
          endGame();
        }
      }
    }
  }

  function drawBackgroundBands() {
    const bandCount = 5;
    const bandWidth = W / bandCount;
    ctx.save();
    ctx.globalAlpha = 0.06;
    for (let i = 0; i < bandCount; i++) {
      ctx.fillStyle = i % 2 === 0 ? '#A4AC17' : '#8C9111';
      ctx.fillRect(i * bandWidth, 0, bandWidth, H);
    }
    ctx.restore();
  }

  function drawGround() {
    const groundY = H - GROUND_HEIGHT;
    ctx.fillStyle = COLORS.groundTop;
    ctx.fillRect(0, groundY, W, 6);
    ctx.fillStyle = COLORS.ground;
    ctx.fillRect(0, groundY + 6, W, GROUND_HEIGHT - 6);
  }

  function drawPipe(p) {
    const groundY = H - GROUND_HEIGHT;
    ctx.fillStyle = COLORS.pipe;
    ctx.fillRect(p.x, 0, PIPE_WIDTH, p.gapTop);
    ctx.fillRect(p.x, p.gapTop + PIPE_GAP, PIPE_WIDTH, groundY - (p.gapTop + PIPE_GAP));

    ctx.fillStyle = COLORS.pipeEdge;
    ctx.fillRect(p.x - 4, p.gapTop - 18, PIPE_WIDTH + 8, 18);
    ctx.fillRect(p.x - 4, p.gapTop + PIPE_GAP, PIPE_WIDTH + 8, 18);
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rotation * 0.6);

    ctx.fillStyle = COLORS.bird;
    ctx.beginPath();
    ctx.ellipse(0, 0, bird.radius, bird.radius * 0.82, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = COLORS.birdWing;
    ctx.beginPath();
    ctx.ellipse(-2, 2, bird.radius * 0.55, bird.radius * 0.4, 0.3, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#0F130A';
    ctx.beginPath();
    ctx.arc(bird.radius * 0.35, -bird.radius * 0.25, 2.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#707610';
    ctx.beginPath();
    ctx.moveTo(bird.radius * 0.75, -bird.radius * 0.05);
    ctx.lineTo(bird.radius * 1.35, 0);
    ctx.lineTo(bird.radius * 0.75, bird.radius * 0.2);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawBackgroundBands();
    for (const p of pipes) drawPipe(p);
    drawGround();
    if (started) drawBird();
    else {
      bird.y = H * 0.4 + Math.sin(Date.now() / 300) * 8;
      drawBird();
    }
  }

  function loop(now) {
    if (lastTime === undefined) lastTime = now;
    const dt = Math.min((now - lastTime) / 1000, 0.033);
    lastTime = now;
    update(dt, now);
    render();
    requestAnimationFrame(loop);
  }

  function handleInput(e) {
    if (e.type === 'keydown' && e.code !== 'Space') return;
    e.preventDefault();
    if (!running && started) return;
    flap();
  }

  startBtn.addEventListener('click', (e) => { e.stopPropagation(); flap(); });
  retryBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    overOverlay.classList.add('hidden');
    reset();
    startOverlay.classList.remove('hidden');
  });

  stage.addEventListener('mousedown', flap);
  stage.addEventListener('touchstart', (e) => { e.preventDefault(); flap(); }, { passive: false });
  window.addEventListener('keydown', handleInput);

  reset();
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
